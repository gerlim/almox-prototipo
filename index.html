<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3b4a"><meta name="description" content="Protótipo navegável do ALMOX — sistema industrial de almoxarifado, estoque, requisições e abastecimento."><meta name="almox-build" content="v2.1.1-git-2026-08-18"><title>ALMOX — Protótipo Executivo v2.1.1</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7f8;color:#15323b}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.boot-card{width:min(520px,100%);background:#fff;border:1px solid #dde6e9;border-radius:18px;padding:28px;box-shadow:0 12px 34px rgba(19,55,65,.08)}.boot-title{font-size:22px;font-weight:800;margin-bottom:8px}.boot-sub{color:#64757b;line-height:1.5}.boot-error{margin-top:16px;padding:12px;border-radius:10px;background:#fff0f0;color:#9b3434;display:none;white-space:pre-wrap}</style></head><body><div id="boot"><div class="boot-card"><div class="boot-title">ALMOX</div><div class="boot-sub">Carregando protótipo executivo…</div><div class="boot-error" id="boot-error"></div></div></div><div id="app"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite" aria-atomic="true"></div><script>
const cssParts=['payload/css.txt'];const jsParts=['payload/js0.txt','payload/js1.txt','payload/js2.txt','payload/js3.txt'];
async function load(parts){return (await Promise.all(parts.map(async p=>{const r=await fetch(p+'?v=211',{cache:'no-store'});if(!r.ok)throw new Error('Arquivo não encontrado: '+p);return r.text()}))).join('')}
function normalizeBase64(s){s=s.replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return s}
async function unzip(s){s=normalizeBase64(s);const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Atualize o Chrome ou Edge para abrir este protótipo.');const ds=new DecompressionStream('gzip');return new TextDecoder().decode(await new Response(new Blob([b]).stream().pipeThrough(ds)).arrayBuffer())}
(async()=>{try{const [cb,jb]=await Promise.all([load(cssParts),load(jsParts)]);const [css,js]=await Promise.all([unzip(cb),unzip(jb)]);const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);document.getElementById('boot')?.remove();(0,eval)(js)}catch(e){console.error(e);const x=document.getElementById('boot-error');if(x){x.style.display='block';x.textContent='Falha ao carregar o protótipo: '+(e?.message||e)}}})();
</script></body></html>
